<svg xmlns="http://www.w3.org/2000/svg" width="880" height="34" viewBox="0 613 880 34" role="img" aria-label="Contributor counts belong to upstream projects"><title>Contributor counts belong to upstream projects</title><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f4efe4} .s{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif} .m{fill:#8fa6a1}
    @keyframes bl{50%{opacity:0}} .cur{animation:bl 1.1s steps(1) infinite}
    @keyframes fl{0%,100%{opacity:1}50%{opacity:.35}} .w{animation:fl 3s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){.cur,.w{animation:none}}</style><rect x="0" y="613" width="880" height="34" fill="#0e1718"/><line x1="1" y1="613" x2="1" y2="647" stroke="#c084fc"/><line x1="879" y1="613" x2="879" y2="647" stroke="#c084fc"/><line x1="1" y1="646.5" x2="879" y2="646.5" stroke="#c084fc"/><text x="16" y="633" font-size="10" class="m">Counts belong to the upstream projects and are tallied only here, never in the totals above.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="74" viewBox="0 0 880 74" role="img" aria-label="FLOSS maintenance is my full-time job. Your sponsorship keeps 200+ libraries maintained, secure and released."><title>FLOSS maintenance is my full-time job. Your sponsorship keeps 200+ libraries maintained, secure and released.</title><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f4efe4} .s{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif} .m{fill:#8fa6a1}

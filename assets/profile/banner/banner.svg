    @keyframes fl{0%,100%{opacity:1}50%{opacity:.35}} .w{animation:fl 3s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){.cur,.w{animation:none}}</style><rect x="0" y="0" width="880" height="74" fill="#0e1718"/><line x1="1" y1="0" x2="1" y2="74" stroke="#25403c"/><line x1="879" y1="0" x2="879" y2="74" stroke="#25403c"/><line x1="1" y1="0.5" x2="879" y2="0.5" stroke="#25403c"/><rect x="12" y="14" width="4" height="46" fill="#e8b04a"/><text x="28" y="34" class="s" font-size="20" font-weight="700">FLOSS maintenance is my full-time job.</text><text x="28" y="56" font-size="12" class="m">Your sponsorship keeps 200+ libraries maintained, secure and released.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="56" viewBox="660 0 220 56" role="img" aria-label="Chat: Discord"><title>Chat: Discord</title><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f4efe4} .s{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif} .m{fill:#8fa6a1}
    @keyframes bl{50%{opacity:0}} .cur{animation:bl 1.1s steps(1) infinite}
    @keyframes fl{0%,100%{opacity:1}50%{opacity:.35}} .w{animation:fl 3s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){.cur,.w{animation:none}}</style><rect x="660" y="0" width="220" height="56" fill="#0e1718"/><line x1="879" y1="0" x2="879" y2="56" stroke="#25403c"/><line x1="1" y1="55.5" x2="879" y2="55.5" stroke="#25403c"/><rect x="666" y="4" width="198" height="44" rx="6" fill="#14211f" stroke="#4fc3b3" stroke-opacity=".7"/><text x="680" y="24" font-size="10" letter-spacing="2" style="fill:#4fc3b3">CHAT</text><text x="680" y="40" class="s" font-size="12" font-weight="600">Discord</text></svg>
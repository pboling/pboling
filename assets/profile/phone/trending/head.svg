<svg xmlns="http://www.w3.org/2000/svg" width="390" height="34" viewBox="0 0 390 34" role="img" aria-label="Trending stars"><title>Trending stars</title><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f4efe4} .s{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif} .m{fill:#8fa6a1}
    @keyframes bl{50%{opacity:0}} .cur{animation:bl 1.1s steps(1) infinite}
    @media (prefers-reduced-motion:reduce){.cur{animation:none}}</style><rect width="390" height="34" fill="#0e1718"/><line x1="1" y1="0" x2="1" y2="34" stroke="#25403c"/><line x1="389" y1="0" x2="389" y2="34" stroke="#25403c"/><line x1="0" y1="0.5" x2="390" y2="0.5" stroke="#25403c"/><text x="12" y="21" font-size="10" class="m" letter-spacing="1.5">TRENDING · STARS, 12 MONTHS</text></svg>
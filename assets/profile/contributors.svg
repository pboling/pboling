<svg xmlns="http://www.w3.org/2000/svg" width="880" height="510" viewBox="0 0 880 510" role="img" aria-label="Contributions to other people's projects, shown separately from the projects I author and maintain"><title>Contributions to other people's projects, shown separately from the projects I author and maintain</title><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f4efe4} .s{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif} .m{fill:#8fa6a1}

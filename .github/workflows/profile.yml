name: profile
on:
  schedule: [{cron: "17 */6 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 tools/profile/sync_data.py
      - run: python3 tools/profile/fetch.py pboling
      - run: python3 tools/profile/feeds.py
      - run: python3 tools/profile/logos.py
      - run: python3 tools/profile/stars.py
      - run: python3 tools/profile/render.py
      - run: |
          # Automated commits are authored by the machine user autobolt so they never count as pboling's own.
          git config user.name "autobolt"; git config user.email "32689569+autobolt@users.noreply.github.com"
          git add -A data assets/profile assets/logos assets/langs README.md
          git diff --staged --quiet && exit 0
          git commit -m "chore: refresh profile"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

name: profile
on:
  schedule: [{cron: "17 16 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 tools/profile/fetch.py pboling
      - run: python3 tools/profile/render.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data assets/profile
          git diff --staged --quiet || (git commit -m "chore: refresh profile" && git push)
